name: Web Demo

# The hosted read-only web demo (DEC-0021). After Mobile CI passes on main this
# exports the web build against https://app.perpeto.xyz, publishes it as
# ghcr.io/<repository>:web-<sha> (and web-main), and rolls it onto the staging
# host. The deploy identity is the backend's perpeto-web-deployer IAM user,
# which may only send the Perpeto-UpdateWeb SSM document; create its key with
# perpeto-backend's scripts/aws/create-deploy-key.sh.

on:
  workflow_run:
    workflows: ["Mobile CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-demo-main
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then sha="$RUN_SHA"; else sha="${{ github.sha }}"; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "expected a full commit SHA" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Export the web build
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://app.perpeto.xyz
          EXPO_PUBLIC_WEB_DEMO: "true"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:web-${{ steps.source.outputs.sha }}
            ghcr.io/${{ github.repository }}:web-main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
      - id: publish
        run: echo "image=ghcr.io/${{ github.repository }}:web-${{ steps.source.outputs.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    if: vars.WEB_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: web-demo
      url: https://app.perpeto.xyz
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Roll the web container on the staging host
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          instance="$(aws cloudformation describe-stacks --stack-name Perpeto-Staging \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text)"
          id="$(aws ssm send-command --instance-ids "$instance" --document-name Perpeto-UpdateWeb \
            --parameters "image=$IMAGE" --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$id" --instance-id "$instance" || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          status="$(aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
            --query Status --output text)"
          [[ "$status" == "Success" ]] || { echo "update-web.sh finished as $status" >&2; exit 1; }
      - name: Check the public demo
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 -o /dev/null https://app.perpeto.xyz/
          curl --fail --silent --show-error https://app.perpeto.xyz/readyz
